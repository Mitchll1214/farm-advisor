<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">农忙参谋 — 按所在地区自动识别当季作物的农事建议页面</title>
  <desc id="heroDesc">左侧为项目名与一句话说明：按所在地块位置自动识别当季作物，给出灌溉、霜冻、积温、干旱与打药窗口建议；下方标注 20 种作物、34 个省级地区档案、7 类建议、三级定位。右侧为一张真实样式的建议卡片示例：灌溉类、预警级，结论为「根区水分偏低，建议灌溉约 45 mm」，并列出根区土壤湿度 19.0 %、灌溉触发阈值 72 mm、未来 24 小时 ETc 4.8 mm。</desc>

  <rect width="1200" height="340" rx="24" fill="#f7f4ec" />
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#e0dacb" />

  <!-- 品牌标记：与页面上同一枚麦穗 -->
  <g transform="translate(64 54) scale(1.3)" stroke="#1f6f4a" fill="#1f6f4a" stroke-width="1.6" stroke-linecap="round">
    <path d="M16 30V9" fill="none" stroke-width="1.8" />
    <ellipse cx="16" cy="13" rx="3.1" ry="5.8" stroke="none" />
    <path d="M16 25c-5-2-7-6-7-11M16 25c5-2 7-6 7-11" fill="none" />
    <path d="M16 6.5c1.8 1.6 2.6 3.4 2.5 5.4M16 6.5c-1.8 1.6-2.6 3.4-2.5 5.4" fill="none" opacity="0.7" />
  </g>

  <text x="118" y="90" font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="52" font-weight="600" fill="#14533a">农忙参谋</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#1b2b22">
    <text x="64" y="162">按所在地块位置自动识别当季作物，</text>
    <text x="64" y="198">给出灌溉、霜冻、积温、干旱与打药窗口建议</text>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#5b6b61">
    <text x="64" y="256">20 种作物 · 34 个省级地区档案 · 7 类建议</text>
    <text x="64" y="286">三级定位 · 无需账号 · 运行时零依赖</text>
  </g>

  <!-- 右侧：一张真实样式的建议卡片 -->
  <g transform="translate(700 52)">
    <rect width="436" height="260" rx="10" fill="#fffdf8" stroke="#e0dacb" />

    <text x="24" y="42" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#5b6b61" letter-spacing="1">灌溉</text>

    <rect x="300" y="22" width="112" height="30" rx="15" fill="#f7e3cf" stroke="#e5c39f" />
    <circle cx="320" cy="37" r="4" fill="#b8531a" />
    <text x="334" y="43" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8f3f12">预警</text>

    <g font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif" font-size="26" fill="#1b2b22">
      <text x="24" y="99">根区水分偏低，</text>
      <text x="24" y="135">建议灌溉约 45 mm</text>
    </g>

    <line x1="24" y1="160" x2="412" y2="160" stroke="#e0dacb" />

    <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#5b6b61">
      <text x="24" y="192">根区土壤湿度 19.0 %</text>
      <text x="24" y="218">灌溉触发阈值 72 mm · ETc 4.8 mm</text>
    </g>

    <text x="24" y="248" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8b978d">示例输出，数值随地区、作物与时间变化</text>
  </g>
</svg>
